name: Verify napplets

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run tsc
      - run: npm test
      - run: npm run build:napplet
      - run: npm run build:notes
      # The browser tests answer the compiled mint with a fixture in the page;
      # nothing reaches this address during the run.
      - run: npm run build:collection
        env:
          BEARLETT_MINT: https://tcg.nappelin.com
      # Only the browser tests open this one; it is never uploaded.
      - run: npm run build:collection
        env:
          BEARLETT_MINT: https://tcg.nappelin.com
          BEARLETT_ACCOUNT_WALLETS: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:napplet:browser
      # Informational until the three builds pass: the static scan finds
      # fetch( and localStorage in the bundles (Vite's modulepreload
      # polyfill, the LNURL service transport, the vendored NutFT wallet),
      # and Notes calls inc.on on the reference shell's empty inc object.
      - run: npm run test:conformance
        continue-on-error: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bearlett-napplets
          include-hidden-files: true
          path: |
            dist-napplet/
            dist-notes/
      # The alpha collection exactly as built here: index.html and its
      # .nip5a-manifest.json, for a host to check against. Nothing is published.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bearlett-collection-600b-e1
          include-hidden-files: true
          if-no-files-found: error
          path: dist-collection-600b-e1/
