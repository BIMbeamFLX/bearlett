name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run tsc
      # LUD-25's and the conformance suite's vectors, and the wallet's flows
      # against the suite's adversarial mock mint
      - run: npm test
      - run: npm run build
      - run: npm run build:napplet
      # The page and the manifest must name the same napplet and domains,
      # inside the first 1024 bytes of the page.
      - run: npm run check:napplets
      # NIP-5D conformance: boot, forbidden globals, degradation without
      # domains. The wallet napplet passes it; a regression fails the build.
      - run: npm run test:conformance
      # informational only - surfaces newly disclosed advisories without
      # failing an otherwise-green build over an unmaintained transitive dep
      - run: npm audit --audit-level=high
        continue-on-error: true

  kernel:
    # Bitcoin Core's own interpreter judges the spends Bearlett builds:
    # lnurlcash-kernel ships Linux wheels only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 -m venv .kernel && .kernel/bin/pip install lnurlcash-kernel==0.1.0
      - run: node tests/kernel/cases.ts > kernel-cases.json
      - run: .kernel/bin/python tests/kernel/judge.py kernel-cases.json
