name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run tsc
      # LUD-25's and the conformance suite's vectors, and the wallet's flows
      # against the suite's adversarial mock mint
      - run: npm test
      - run: npm run build
      - run: npm run build:napplet
      # The page and the manifest must name the same napplet and domains,
      # inside the first 1024 bytes of the page.
      - run: npm run check:napplets
      # NIP-5D conformance: boot, forbidden globals, degradation without
      # domains. The wallet napplet passes it; a regression fails the build.
      - run: npm run test:conformance
      # informational only - surfaces newly disclosed advisories without
      # failing an otherwise-green build over an unmaintained transitive dep
      - run: npm audit --audit-level=high
        continue-on-error: true

  kernel:
    # Bitcoin Core's own interpreter judges the spends Bearlett builds:
    # lnurlcash-kernel ships Linux wheels only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python3 -m venv .kernel && .kernel/bin/pip install lnurlcash-kernel==0.1.0
      - run: node tests/kernel/cases.ts > kernel-cases.json
      - run: .kernel/bin/python tests/kernel/judge.py kernel-cases.json

  mesh:
    # LNURLcash over FIPS (fips.network) end to end: two FIPS nodes in network
    # namespaces, a mint and a TollGate that exist only on the mesh, and the
    # wallet core minting, handing out, receiving, paying, recovering and
    # buying network access through http://<npub>.fips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Fetch FIPS 0.5.1
        run: |
          curl -fsSLO https://github.com/jmcorgan/fips/releases/download/v0.5.1/fips-0.5.1-linux-x86_64.tar.gz
          echo "1743e73a47aa367d5bd0f04eb24c29cdc06f200fd1f0ab1ee4a110872a19eeeb  fips-0.5.1-linux-x86_64.tar.gz" | sha256sum -c -
          tar -xzf fips-0.5.1-linux-x86_64.tar.gz
      - run: sudo env "PATH=$PATH" FIPS_BIN="$PWD/fips-0.5.1-linux-x86_64" bash tests/mesh/run.sh
